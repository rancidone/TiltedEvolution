name: Co-op development build

on:
  push:
    branches:
      - coop/build-baseline
      - coop/diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: releasedbg
      skyrim-version: latest
      upload-build-for-next-job: true
